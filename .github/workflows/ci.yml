name: CI

# ONE ubuntu job. Deliberately.
#
# Actions was billing-parked while the repo was private; re-enabled 2026-08-08
# when the repo went public (ADR-0022). The one-job shape stays — cost
# discipline is still a feature.
#
# CI is the authoritative gate; the local `pnpm verify` pre-push hook is the
# fast pre-flight. This job proves the one thing local runs cannot catch:
# "works on my machine" (a cold checkout, no prebuilt dist, no stale node_modules).
#
# Every suite that was previously its own job still runs here, and each one
# throws rather than skips when CI is set and its configuration is missing, so
# merging jobs cannot silently drop a gate. That guard is in the suites
# themselves (tenant-isolation.test.ts, git-service test helpers), not here.
on:
  # Re-enabled 2026-08-08 (ADR-0022): the repo is public and Actions minutes are
  # free. CI is the authoritative gate again.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: verify (lint, types, build, tests, isolation gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d zapp"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      forgejo:
        image: codeberg.org/forgejo/forgejo:9
        env:
          FORGEJO__security__INSTALL_LOCK: 'true'
          FORGEJO__database__DB_TYPE: sqlite3
          FORGEJO__database__PATH: /data/gitea/forgejo.db
          FORGEJO__server__OFFLINE_MODE: 'true'
          FORGEJO__server__ROOT_URL: http://localhost:3000/
          FORGEJO__service__DISABLE_REGISTRATION: 'true'
          FORGEJO__service__ENABLE_BASIC_AUTHENTICATION: 'true'
          FORGEJO__service__DEFAULT_USER_VISIBILITY: private
          FORGEJO__service__DEFAULT_ORG_VISIBILITY: private
          FORGEJO__repository__DEFAULT_PRIVATE: private
          FORGEJO__actions__ENABLED: 'false'
          FORGEJO__mailer__ENABLED: 'false'
          FORGEJO__cron__ENABLED: 'false'
        ports: ['3000:3000']
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz"
          --health-interval 10s --health-timeout 10s --health-retries 30
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zapp
      REDIS_URL: redis://localhost:6379
      FORGEJO_URL: http://localhost:3000
      NEXT_PUBLIC_FARO_URL: ${{ github.event_name == 'push' && vars.GRAFANA_FARO_WEB_URL || '' }}
      NEXT_PUBLIC_ZAPP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
      NEXT_PUBLIC_ZAPP_RELEASE: ${{ github.sha }}
      NEXT_PUBLIC_FARO_BUNDLE_ID: ${{ github.sha }}

    steps:
      # persist-credentials: false -- this job runs repo code and package
      # postinstall scripts, so no push-capable token is left in .git/config.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Must precede setup-node: `cache: pnpm` shells out to `pnpm store path`.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Run the CLI resolved from apps/web so the downloaded browser revision
      # always matches the workspace lockfile used by both web and Storybook.
      - name: Install Chromium
        run: pnpm --filter @zapp/web exec playwright install --with-deps chromium

      - name: Seed the Forgejo admin token
        id: forgejo
        run: |
          set -euo pipefail
          container="$(docker ps --filter 'ancestor=codeberg.org/forgejo/forgejo:9' --format '{{.ID}}' | head -1)"
          if [ -z "$container" ]; then
            echo "::error::no forgejo service container found"; docker ps; exit 1
          fi
          password="$(openssl rand -hex 24)"
          docker exec -u git "$container" forgejo admin user create \
            --admin --username zapp-ci --email ci@zapp.local \
            --password "$password" --must-change-password=false
          token="$(docker exec -u git "$container" forgejo admin user generate-access-token \
            --username zapp-ci --token-name ci --scopes all --raw | tr -d '\r\n')"
          if [ -z "$token" ]; then echo "::error::failed to mint a Forgejo admin token"; exit 1; fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "SERVICE_TOKEN_SECRET=$secret" >> "$GITHUB_ENV"

      # apps/desktop is the vendored Electron tree and defines none of the shared
      # tasks; the guard keeps the filter valid on checkouts that predate it.
      - name: Resolve turbo filters
        id: filters
        run: |
          if [ -f apps/desktop/package.json ]; then
            echo "desktop=--filter=!@zapp/desktop" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=" >> "$GITHUB_OUTPUT"
          fi

      # One DAG: typecheck/test wait only on the builds they need. --continue so
      # one CI round-trip reports every failure instead of the first.
      - name: Lint, typecheck, build, test
        run: pnpm turbo run lint typecheck build test --continue ${{ steps.filters.outputs.desktop }}

      - name: Upload private web source maps to Grafana Faro
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FARO_ENDPOINT: ${{ vars.GRAFANA_FARO_SOURCEMAP_ENDPOINT }}
          FARO_APP_ID: ${{ vars.GRAFANA_FARO_WEB_APP_ID }}
          FARO_STACK_ID: ${{ vars.GRAFANA_FARO_STACK_ID }}
          FARO_API_KEY: ${{ secrets.GRAFANA_FARO_SOURCEMAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FARO_ENDPOINT" ] || [ -z "$FARO_APP_ID" ] || [ -z "$FARO_STACK_ID" ] || [ -z "$FARO_API_KEY" ]; then
            echo "::notice title=Faro source maps skipped::Grafana Faro source-map variables or token are not configured."
            exit 0
          fi
          pnpm --filter @zapp/web exec faro-cli upload \
            --endpoint "$FARO_ENDPOINT" --app-id "$FARO_APP_ID" \
            --api-key "$FARO_API_KEY" --stack-id "$FARO_STACK_ID" \
            --bundle-id "$GITHUB_SHA" --app-name zapp-web \
            --output-path .next/static --recursive --gzip-contents

      - name: Integration suites
        env:
          FORGEJO_ADMIN_TOKEN: ${{ steps.forgejo.outputs.token }}
        run: pnpm turbo run test:integration ${{ steps.filters.outputs.desktop }} --concurrency=1

      # Named directly rather than through turbo: these are the multi-tenant
      # guarantees (M0 exit criterion + repository-scoped token isolation), and
      # nothing between the gate and the files should be able to skip them. The
      # suites themselves throw when CI is set and configuration is absent.
      - name: Tenant isolation gate
        run: pnpm --filter @zapp/control-api run test:isolation

      - name: Control API to Forgejo integration gate
        env:
          FORGEJO_ADMIN_TOKEN: ${{ steps.forgejo.outputs.token }}
        run: pnpm --filter @zapp/control-api run test:gate5
