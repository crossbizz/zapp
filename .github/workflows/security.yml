name: Security

on:
  # Re-enabled 2026-08-08 (ADR-0022): the repo is public and Actions minutes are
  # free. Runs on every push alongside CI.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A job-level block *replaces* the workflow-level one rather than adding to
    # it, so `contents: read` is repeated here for the checkout.
    #
    # `pull-requests: read` is what this job was missing. On a `pull_request`
    # event the action scans the PR's commit range, which it reads from
    # `GET /repos/{owner}/{repo}/pulls/{number}/commits` -- an endpoint
    # `contents: read` does not cover. Without it the action crashed before
    # scanning anything: `RequestError [HttpError]: Resource not accessible by
    # integration` (403) out of `ScanPullRequest`, on every PR this repo has
    # ever had (run 30922986837, and its two siblings). Three Dependabot PRs
    # have been permanently red on a job that never ran a scan.
    #
    # Read and not write, on purpose: a Dependabot-triggered run gets a
    # read-only GITHUB_TOKEN that no `permissions:` block can raise, so a job
    # that needed write here could not be fixed at all -- see
    # GITLEAKS_ENABLE_COMMENTS below.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # gitleaks scans commit history, not just the tip tree, so the default
          # shallow clone would hide anything committed and later removed.
          fetch-depth: 0

      # Blocking from day one: the job fails if any secret is found.
      # GITLEAKS_LICENSE is only required for repos owned by a GitHub
      # organization; crossbizz is a user account, so none is needed.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action posts its findings as PR comments by default, which needs
          # `pull-requests: write` -- a permission a Dependabot run cannot be
          # granted, so leaving it on would trade one guaranteed 403 for
          # another. A finding still fails the job, and still names the file and
          # line in the step log and the job summary; the comment was never the
          # blocking part.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  license-boundary:
    name: license boundary (no Dyad src/pro)
    # Weekly + PR only: this is advisory/slow-moving and does not need to
    # re-run on every push to main (private repo = metered minutes).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # persist-credentials: false -- nothing here needs a token, and this job runs
      # against untrusted PR content.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No pnpm install, no Node: this is a grep over the checked-out tree and has to
      # stay fast enough to be uninteresting.
      #
      # Upstream Dyad is dual-licensed -- everything outside `src/pro/` is Apache-2.0,
      # `src/pro/` is proprietary (Functional Source License 1.1). Only the Apache-2.0
      # portion is vendored (NOTICE, docs/adr/0002-dyad-fork.md), so master plan global
      # constraint 17 bans importing `src/pro` from anywhere in this repo.
      #
      # This is the half of that ban that covers `apps/desktop`. The other half is the
      # `zapp/no-dyad-pro-imports` ESLint rule (packages/eslint-rules), which is precise
      # but only sees what the root ESLint config lints -- and the vendored tree is not
      # in the root lint graph. Neither half is redundant.
      #
      # Scope caveat: this gate proves no *import* of Pro code survives. It filters
      # comment lines (a comment cannot import anything), so a commented-out block of
      # pasted Pro source would pass it. The stronger "no derived Pro code at all" claim
      # is a human obligation on the quarterly upstream-merge checklist, not something
      # grep establishes. See docs/adr/0001-locked-p0-decisions.md.
      - name: No imports of Dyad `src/pro`
        run: |
          set -euo pipefail

          # Four specifier shapes. Each ends `pro(/|["'])` so a directory import
          # (`from "@/pro"`, `"src/pro"`, `"./pro"`) is caught as well as a subpath, and
          # each is segment-anchored so legitimate neighbours stay quiet: `./main/pro`
          # (src/main/pro.ts), `src/production/`, `src/prompts/`, `pro_stubs/`,
          # `@dyad-sh/desktop/promises` and the https://dyad.sh/pro marketing URL.
          pattern="(^|[^A-Za-z0-9_.-])src/pro(/|[\"'])|[\"'](\.\.?/)+pro(/|[\"'])|[\"']@/pro(/|[\"'])|@dyad[^\"']*/pro(/|[\"'])"

          # Self-test the pattern before trusting a clean result: a typo that matches
          # nothing would otherwise pass this job silently, forever.
          must_match=(
            'import { x } from "src/pro/main/foo";'
            'import { x } from "../pro/main/foo";'
            'import { x } from "./pro/main/foo";'
            'import { x } from "@/pro/shared/foo";'
            'const x = require("@dyad-sh/desktop/pro/main/foo");'
            'import "src/pro/main/register";'
            'export { y } from "@/pro/shared/y";'
            "import x = require('src/pro/y');"
            'import x from "@/pro";'
            'import x from "src/pro";'
            'import x from "./pro";'
            'import x from "../pro";'
            'const x = require("@dyad-sh/desktop/pro");'
          )
          must_not_match=(
            'import { handleDyadProReturn } from "./main/pro";'
            'import { x } from "@/zapp/pro_stubs/shared";'
            'import { x } from "src/production/config";'
            'import { x } from "src/prompts/guides/foo";'
            'import { x } from "@dyad-sh/desktop/promises";'
            'ipc.system.openExternalUrl("https://dyad.sh/pro");'
          )
          for line in "${must_match[@]}"; do
            if ! printf '%s\n' "$line" | grep -qE "$pattern"; then
              echo "::error::pattern self-test failed: should have matched: $line"
              exit 1
            fi
          done
          for line in "${must_not_match[@]}"; do
            if printf '%s\n' "$line" | grep -qE "$pattern"; then
              echo "::error::pattern self-test failed: should not have matched: $line"
              exit 1
            fi
          done
          echo "pattern self-test: $(( ${#must_match[@]} + ${#must_not_match[@]} )) cases OK"

          # Whole top-level trees, not hand-picked subdirectories: `apps` covers the
          # vendored app's e2e-tests, testing, scripts, tools, its own packages/ (incl.
          # the vendored @dyad-sh ones) and its root-level *.ts configs, and picks up
          # future apps/* automatically. Presence-guarded because services/ and sandbox/
          # do not exist yet, and `grep` on a missing directory is an error rather than
          # an empty result.
          roots=()
          for dir in apps packages services sandbox; do
            if [ -d "$dir" ]; then roots+=("$dir"); fi
          done
          # An empty root list means the layout moved and this gate went blind, which
          # must fail rather than report success against nothing.
          if [ ${#roots[@]} -eq 0 ]; then
            echo "::error::no scan roots found -- the license boundary gate is scanning nothing"
            exit 1
          fi
          echo "scanning: ${roots[*]}"

          # Filters, narrowest first:
          #  - `//`, `*`, `/*`, `{/*` line prefixes: a comment cannot import anything,
          #    and the vendored tree documents each removed Pro module in a comment.
          #  - `zapp: pro-removed`: the marker MAC-1 leaves at every stubbed call site.
          #  - the ESLint rule's own fixtures, which are real banned imports on purpose.
          #    Anchored to the exact directory: an unanchored `__fixtures__` would also
          #    drop real source whose trailing comment happens to say "__fixtures__".
          # -I skips binary files: `apps` contains assets, and "Binary file X matches"
          # is not an actionable offender line.
          matches=$(
            grep -rnEI \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=out \
              --exclude-dir=.turbo --exclude-dir=coverage --exclude-dir=.next \
              --exclude='*.md' \
              "$pattern" "${roots[@]}" \
              | grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|\*|/\*|\{/\*)' \
              | grep -v 'zapp: pro-removed' \
              | grep -v '^packages/eslint-rules/test/__fixtures__/' \
              || true
          )

          # A `src/pro` directory must not exist at all, regardless of who imports it.
          dirs=$(find "${roots[@]}" -type d -path '*/src/pro' -not -path '*/node_modules/*' || true)

          # NOTICE is the Apache-2.0 §4(d) attribution for the vendored tree. Losing it
          # is a licence violation even with zero Pro imports.
          notice_error=""
          if [ ! -f NOTICE ]; then
            notice_error="NOTICE is missing"
          elif ! grep -q 'apps/desktop' NOTICE; then
            notice_error="NOTICE no longer attributes apps/desktop"
          fi

          failed=0
          if [ -n "$matches" ]; then
            echo "::error::Imports of Dyad Pro code found. src/pro is FSL-1.1, not Apache-2.0, and is not vendored here."
            printf '%s\n' "$matches"
            failed=1
          fi
          if [ -n "$dirs" ]; then
            echo "::error::A src/pro directory exists in the tree:"
            printf '%s\n' "$dirs"
            failed=1
          fi
          if [ -n "$notice_error" ]; then
            echo "::error::$notice_error -- see docs/adr/0002-dyad-fork.md"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then exit 1; fi

          echo "license boundary clean: no src/pro imports, no src/pro directory, NOTICE present"

  dependencies:
    name: dependency scan (osv-scanner)
    # Weekly + PR only: this is advisory/slow-moving and does not need to
    # re-run on every push to main (private repo = metered minutes).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Advisory in M0: findings are reported but do not fail the build.
      # OPS-13 (M5) removes continue-on-error to make this blocking.
      #
      # google/osv-scanner-action publishes no floating major tag, so this is
      # pinned to an exact release rather than @v2. The reusable workflow is
      # deliberately not used: it uploads SARIF to code scanning (unavailable on
      # a private repo without Advanced Security) and reusable-workflow jobs
      # cannot take continue-on-error.
      #
      # scan-args is newline-separated; each line becomes one argv entry.
      - name: OSV scan (pnpm-lock.yaml)
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            scan
            source
            --lockfile=./pnpm-lock.yaml

      - name: Publish advisory note
        if: always()
        env:
          OSV_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          {
            echo "### Dependency scan (osv-scanner) - advisory only"
            echo ""
            echo "Scanned \`pnpm-lock.yaml\` against the OSV database."
            echo ""
            echo "- Scan step outcome: \`${OSV_OUTCOME}\` (\`failure\` means vulnerabilities were reported)"
            echo "- Findings do **not** fail CI in M0 (\`continue-on-error: true\`)"
            echo "- This check becomes blocking in OPS-13 (M5)"
            echo ""
            echo "Open the **OSV scan (pnpm-lock.yaml)** step log for the full vulnerability table."
          } >> "$GITHUB_STEP_SUMMARY"
