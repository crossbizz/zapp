name: Desktop

# Packages the macOS app (@zapp/desktop) and runs the PRD §21.1 capability
# preservation suite against that package. Split from ci.yml because both need a
# macOS runner, a standalone hoisted install, and real time -- none of which
# should sit in front of every PR that does not touch the desktop app.
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  push:
    # main is included so the preserve suite actually guards the branch: work
    # lands on main directly here, so a PR-only trigger would leave the
    # regression net inert. `paths` gates the branch pushes; per GitHub's
    # workflow syntax reference, "path filters are not evaluated for pushes of
    # tags", so the v* release trigger below is unaffected by it.
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarize (requires the Apple secrets to be set)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  DO_NOT_TRACK: '1'

jobs:
  package-macos:
    name: package macOS app
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      # persist-credentials: false -- this job runs repo code and package
      # postinstall scripts (native rebuilds), so no push-capable token is left
      # behind in .git/config for them to pick up.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      # No `cache: pnpm` here, unlike ci.yml: this job never does a workspace
      # install. `install:packaging` uses its own --store-dir (see below), which
      # is deliberately not cached -- it is a full copy of a ~2 GB dependency
      # tree and would dominate the repo's 10 GB cache budget. The Electron
      # binary and node-gyp headers are the expensive, stable part, so those are
      # cached instead.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Cache Electron and node-gyp downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/node-gyp
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # A release build is a v* tag, or a manual run that explicitly asked to
      # sign. Everything else (every PR) is an unsigned E2E-flavoured build:
      # E2E_TEST_BUILD also skips the "Move to Applications Folder?" modal, so
      # the artifact can be launched unattended.
      - name: Resolve build mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SIGN_INPUT: ${{ inputs.sign }}
        run: |
          release=false
          case "$EVENT_NAME:$REF" in
            push:refs/tags/v*) release=true ;;
          esac
          if [ "$SIGN_INPUT" = "true" ]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release build: $release"

      # Secrets cannot be referenced from a job/step `if:`, so presence is
      # resolved here into plain outputs. Absent credentials are a visible skip,
      # never a failure: the Developer ID cert is still pending (AGENTS.md §10),
      # and PR builds are unsigned by design.
      - name: Check signing credentials
        id: creds
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RELEASE: ${{ steps.mode.outputs.release }}
        run: |
          sign=false
          notarize=false
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            sign=true
          fi
          if [ "$sign" = "true" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            notarize=true
          fi

          # A skip on a PR is the design; a skip on a release build means an
          # unsigned or un-notarized artifact would ship from a green run, so
          # that one is a warning and is meant to be noticed.
          if [ "$RELEASE" != "true" ]; then
            echo "::notice title=Unsigned build::PR and non-release builds are unsigned by design."
            sign=false
            notarize=false
          elif [ "$sign" != "true" ]; then
            echo "::warning title=Code signing skipped on a RELEASE build::MACOS_CERT_P12 / MACOS_CERT_PASSWORD / APPLE_TEAM_ID are not set. This release artifact is UNSIGNED and Gatekeeper will block it."
          elif [ "$notarize" != "true" ]; then
            echo "::warning title=Notarization skipped on a RELEASE build::APPLE_ID / APPLE_APP_PASSWORD are not set. This release artifact is signed but NOT notarized, so Gatekeeper will block it."
          fi

          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          echo "sign=$sign notarize=$notarize"

      # Developer ID cert into a throwaway keychain. Its path is handed to
      # @electron/osx-sign via forge.config.ts so codesign cannot pick up some
      # other identity from the runner's default search list.
      - name: Import Developer ID certificate
        if: steps.creds.outputs.sign == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/zapp-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert_path="$RUNNER_TEMP/zapp-developer-id.p12"

          printf '%s' "$MACOS_CERT_P12" | openssl base64 -d -A -out "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          rm -f "$cert_path"

          security find-identity -v -p codesigning "$keychain_path"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      # make:mac = install:packaging (standalone hoisted install into its own
      # pnpm store) + electron-forge make. --skip-restore because this runner's
      # workspace is thrown away afterwards; locally the script restores the
      # workspace install and verifies the native modules are back on node's ABI.
      #
      # The Apple secrets are gated on the credential check rather than passed
      # unconditionally: on every PR build -- which is every build until certs
      # exist -- this step runs the repo's own code plus hundreds of package
      # postinstall scripts, and none of them should have the signing
      # credentials in their environment merely because the build is unsigned.
      - name: Package
        env:
          E2E_TEST_BUILD: ${{ steps.mode.outputs.release == 'true' && 'false' || 'true' }}
          ZAPP_MACOS_SIGN: ${{ steps.creds.outputs.sign }}
          ZAPP_MACOS_NOTARIZE: ${{ steps.creds.outputs.notarize }}
          APPLE_ID: ${{ steps.creds.outputs.notarize == 'true' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ steps.creds.outputs.sign == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ steps.creds.outputs.notarize == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
        # `--` so pnpm forwards the flag to the script instead of parsing it.
        run: pnpm run make:mac -- --skip-restore

      # Identity is the deliverable of MAC-2, so it is asserted rather than
      # eyeballed: a later upstream merge that resurrects Dyad's bundle id,
      # product name or URL scheme fails here.
      - name: Verify bundle identity
        run: |
          app="$(find out -maxdepth 2 -name 'zapp.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "No zapp.app under apps/desktop/out" >&2
            exit 1
          fi
          echo "app: $app"
          plist="$app/Contents/Info.plist"

          check() {
            actual="$(plutil -extract "$1" raw -o - "$plist")"
            if [ "$actual" != "$2" ]; then
              echo "$1: expected '$2', got '$actual'" >&2
              exit 1
            fi
            echo "$1 = $actual"
          }

          check CFBundleIdentifier build.zapp.desktop
          check CFBundleName zapp
          check CFBundleExecutable zapp
          check CFBundleURLTypes.0.CFBundleURLSchemes.0 zapp

      - name: Verify signature
        if: steps.creds.outputs.sign == 'true'
        run: |
          app="$(find out -maxdepth 2 -name 'zapp.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier'

      # The Gatekeeper assessment only means anything once the app is notarized
      # and stapled; on a merely signed build it fails by design.
      - name: Verify Gatekeeper acceptance
        if: steps.creds.outputs.notarize == 'true'
        run: |
          app="$(find out -maxdepth 2 -name 'zapp.app' -print -quit)"
          xcrun stapler validate "$app"
          spctl --assess --type exec -vvv "$app"

      # v5 to match the pins in ci.yml / security.yml (FND-8); newer majors
      # exist and upgrading them is a repo-wide sweep, not this workflow's job.
      - name: Upload macOS zip
        uses: actions/upload-artifact@v5
        with:
          name: zapp-macos-${{ github.sha }}
          path: apps/desktop/out/make/zip/darwin/**/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keychain
        if: always() && steps.creds.outputs.sign == 'true'
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$RUNNER_TEMP/zapp-signing.keychain-db" || true

  # MAC-3. The preserve suite is a regression net for the §21.1 capabilities the
  # fork must not lose while MAC-4+ swaps Dyad's local agent internals for zapp
  # WorkspaceRuntime contracts -- so it has to run on every change to the app,
  # not on request. Deliberately a separate job from package-macos: this one
  # needs an unsigned E2E build and nothing else, so it must not wait on (or be
  # blocked by) signing, notarization or artifact upload.
  e2e-preserve:
    name: preserve suite (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      # persist-credentials: false for the same reason as the packaging job:
      # this runs repo code plus package postinstall scripts (native rebuilds).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Must run before setup-node: `cache: pnpm` shells out to `pnpm store
      # path`, so a pnpm binary has to be on PATH first.
      - name: Enable corepack
        run: corepack enable

      # Unlike package-macos, `cache: pnpm` earns its keep here. The install
      # below uses its own --store-dir and is not what this caches; the *apps
      # under test* are. The preview and process-management specs boot a real
      # dev server, which makes the app run `pnpm install` for the imported
      # template against the default store -- the slowest part of the suite.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Electron and node-gyp downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/node-gyp
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # The same standalone hoisted install package-macos gets via make:mac:
      # electron-forge cannot package from the workspace's linked layout (see
      # scripts/zapp/install-packaging.mjs). @playwright/test and
      # electron-playwright-helpers come along with it, so this one install
      # serves both the build and the test run.
      - name: Install desktop dependencies
        run: pnpm run install:packaging

      # playwright.config.ts starts this as a `webServer`, but its command only
      # builds and starts -- installing its deps is on us.
      - name: Prepare fake LLM server
        working-directory: apps/desktop/testing/fake-llm-server
        run: npm install && npm run build

      # E2E_TEST_BUILD=true (set by pre:e2e) skips the singleton lock and the
      # "Move to Applications Folder?" modal, so the app launches unattended.
      - name: Package E2E build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run pre:e2e

      # Docker specs skip here -- hosted macOS runners have no daemon -- and the
      # suite logs why. That is the designed behaviour, not a hidden gap. To
      # cover Docker, run this on a runner with Docker and DOCKER_AVAILABLE=1.
      #
      # Step-level timeout so a hung suite is killed with a clear signal instead
      # of silently eating the job budget; if the *job* ever times out, the cold
      # packaging step above is the thing to give more room, not this.
      - name: Run preserve suite
        timeout-minutes: 12
        run: pnpm --filter @zapp/desktop run test:preserve

      # CI selects Playwright's blob reporter (playwright.config.ts), so the
      # useful failure artifacts are that zip plus test-results/, which holds
      # the traces and failure screenshots the fixtures attach.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: preserve-playwright-report-${{ github.sha }}
          path: |
            apps/desktop/blob-report/
            apps/desktop/test-results/
          if-no-files-found: warn
          retention-days: 7
