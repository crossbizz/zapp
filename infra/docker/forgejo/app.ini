; zapp.build — Forgejo configuration for the local dev environment (FND-7).
;
; This file is a SEED. The compose service copies it to /data/gitea/conf/app.ini
; on first boot only; Forgejo then owns that copy and appends its generated
; SECRET_KEY / INTERNAL_TOKEN there. Those generated values stay inside the
; container volume and are never written back into the repo.
;
; Re-seed after editing this file:
;   docker compose -p zapp-dev -f infra/docker/docker-compose.dev.yml down -v
;   ./scripts/dev-up.sh

APP_NAME = zapp.build dev git
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /data/gitea

[server]
PROTOCOL = http
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
; Published on the host as 3300 (see docker-compose.dev.yml).
DOMAIN = localhost
ROOT_URL = http://localhost:3300/
; Git over SSH is served by the image's OpenSSH daemon on container port 22,
; published on the host as 2222. Forgejo's built-in SSH server stays off — both
; would fight over port 22 inside the container.
DISABLE_SSH = false
START_SSH_SERVER = false
SSH_DOMAIN = localhost
SSH_LISTEN_PORT = 22
SSH_PORT = 2222
LFS_START_SERVER = true
APP_DATA_PATH = /data/gitea
; No outbound calls to Forgejo's CDN/version endpoints from a dev box.
OFFLINE_MODE = true

[database]
; SQLite keeps the dev Git server self-contained: no extra database to create,
; and Postgres stays dedicated to the control plane + Temporal.
DB_TYPE = sqlite3
PATH = /data/gitea/forgejo.db
SQLITE_JOURNAL_MODE = WAL
LOG_SQL = false

[security]
; Skip the web installer — this file is the installation.
INSTALL_LOCK = true
; SECRET_KEY and INTERNAL_TOKEN are generated by Forgejo on first start and
; written to its own copy of app.ini. Never commit values for them here.
PASSWORD_HASH_ALGO = pbkdf2
REVERSE_PROXY_LIMIT = 1

[service]
; No self-service accounts: zapp provisions users through the admin API.
DISABLE_REGISTRATION = true
ALLOW_ONLY_INTERNAL_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
ENABLE_NOTIFY_MAIL = false
ENABLE_BASIC_AUTHENTICATION = true
DEFAULT_USER_VISIBILITY = private
DEFAULT_ORG_VISIBILITY = private

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main
DEFAULT_PRIVATE = private
DEFAULT_PUSH_CREATE_PRIVATE = true
ENABLE_PUSH_CREATE_USER = true
ENABLE_PUSH_CREATE_ORG = true

[api]
; Admin API (/api/v1/admin/**) is served for tokens owned by an admin user;
; scripts/dev-up.sh mints that token. Swagger UI lives at /api/swagger.
ENABLE_SWAGGER = true
DEFAULT_PAGING_NUM = 50
DEFAULT_MAX_RESPONSE_ITEMS = 200

[webhook]
; Webhook targets are host-allowlisted. Dev services run on the host, so
; Forgejo must be allowed to call back out to the Docker host and loopback.
ALLOWED_HOST_LIST = host.docker.internal,localhost,127.0.0.1,loopback,private
SKIP_TLS_VERIFY = true
DELIVER_TIMEOUT = 30
PAGING_NUM = 20

[mailer]
ENABLED = false

[actions]
; zapp runs its own verification pipeline; Forgejo Actions stays off.
ENABLED = false

[cron]
ENABLED = true
RUN_AT_START = false

[oauth2]
ENABLED = true

[metrics]
ENABLED = false

[log]
MODE = console
LEVEL = info
logger.router.MODE = console

[other]
SHOW_FOOTER_VERSION = false
SHOW_FOOTER_TEMPLATE_LOAD_TIME = false
